<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Carl Obenza 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        }
        h1 {
            color: #d63384;
            margin-bottom: 40px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #loveBtn {
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff4d6d, #ff0054);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 84, 0.4);
            transition: all 0.3s ease;
        }
        #loveBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 0, 84, 0.5);
        }
        #message {
            margin-top: 40px;
            font-size: 2rem;
            font-weight: bold;
            color: #c1121f;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
            text-align: center;
            padding: 20px;
        }
        #message.show {
            opacity: 1;
            transform: translateY(0);
        }
        .heart {
            font-size: 2.5rem;
            margin: 10px;
            display: inline-block;
            animation: heartbeat 1s infinite alternate;
        }
        @keyframes heartbeat {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <h1>💌 Click the Button 💌</h1>

    <button id="loveBtn">💖 Click Me 💖</button>

    <div id="message">
        <span class="heart">❤️</span>
        I LOVE YOU CARL OBENZA dakog oten
        <span class="heart">❤️</span>
    </div>

    <script>
        const btn = document.getElementById('loveBtn');
        const message = document.getElementById('message');

        // Make sound using built-in browser tone 🎵
        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Sweet melody 💕
            const notes = [523, 659, 784, 1047]; // C E G C
            
            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + index * 0.15);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.15 + 0.3);
                
                oscillator.start(audioContext.currentTime + index * 0.15);
                oscillator.stop(audioContext.currentTime + index * 0.15 + 0.3);
            });
        }

        btn.addEventListener('click', function() {
            playSound(); // 🔊 Plays sound!
            message.classList.add('show');
            btn.innerText = '💝 You Found It! 💝';
            btn.style.background = 'linear-gradient(45deg, #2dce89, #23b273)';
        });
    </script>

</body>
</html>
